[build-system]
requires = ["uv_build>=0.13.10,<1"]
build-backend = "uv_build"

[project]
name = "vfinance"
version = "0.1.0"
description = "Fetch Vietnam stock market data from public sources"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Thanh Ba Nguyen" }]
dependencies = [
    "beautifulsoup4>=4.15.0,<5",
    "cachetools>=8.0.0,<9",
    "cloudscraper>=1.2.0,<2",
    "playwright>=1.62.0,<2",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business :: Financial :: Investment",
]

[project.urls]
Repository = "https://github.com/btnguyen2k/vfinance"
Issues = "https://github.com/btnguyen2k/vfinance/issues"

[dependency-groups]
dev = [
    "pytest>=9.2.0,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.17.6,<1",
    "uv>=0.13.10,<1",
]

[tool.uv.build-backend]
source-include = ["tests/**", "docs/**", "uv.lock"]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
